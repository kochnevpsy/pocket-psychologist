name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug and release APK
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Show produced APKs
        run: find android/app/build/outputs/apk -name "*.apk" -printf "%p %s bytes\n"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocket-psychologist-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  web-check:
    name: Offline check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if the app loads anything from the network
        run: |
          set -euo pipefail
          hits=$(grep -RInE 'fonts\.(googleapis|gstatic)\.com' \
            --include='*.html' --include='*.css' --include='*.js' . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Приложение должно работать без сети: найдены внешние шрифты"
            exit 1
          fi
          echo "OK: внешних шрифтов и сетевых подключений в веб-части нет"

  release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web-check]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: pocket-psychologist-apk
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
